<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Noyau Python</title>
    <!-- Génère automatiquement le bon chemin vers /static/style.css -->
    <!-- - Source: https://stackoverflow.com/questions/61641514/css-not-recognized-when-served-with-fastapi -->
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='/tab.css') }}" rel="stylesheet">
</head>
<body>

    <h1>Tableau de bord - SCI 1402</h1>
    
    <div class="container">
        <!-- DIVISION GAUCHE : Requête -->
        <div class="left-panel">
            <form id="paramForm" method="GET" action="/api/process">
                
                <div class="form-group">
                    <label for="start_date">Date de départ :</label>
                    <input type="date" id="start_date" name="start_date" value="1995-06-16" required>
                </div>

                <div class="form-group">
                    <label for="duration_days">Durée :</label>
                    <select id="duration_days" name="duration_days">
                        <option value="7">1 Semaine (7 jours)</option>
                        <option value="28" selected>1 Mois (28 jours)</option>
                        <option value="90">1 Trimestre (90 jours)</option>
                        <option value="365">1 Année (365 jours)</option>
                        <option value="3653">1 Décennie (3653 jours)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nb_catego">Nombre de catégories désirées :</label>
                    <input type="number" id="nb_catego" name="nb_catego" value="10" min="1" required>
                </div>

                <div class="form-group">
                    <label>Stratégie :</label>
                    <div class="radio-group">
                        <input type="radio" id="mode1" name="strategy" value="tout" checked>
                        <label style="display:inline;" for="mode1">Tout prendre</label>
                        <br>
                        <input type="radio" id="mode2" name="strategy" value="sans_mots_vides">
                        <label style="display:inline;" for="mode2">Exclure les mots vides</label>
                        <br>
                        <input type="radio" id="mode3" name="strategy" value="noms_propres">
                        <label style="display:inline;" for="mode3">Noms propres</label>
                        <br>
                        <input type="radio" id="mode4" name="strategy" value="acronymes">
                        <label style="display:inline;" for="mode4">Acronymes</label>
                        <br>
                        <input type="radio" id="mode5" name="strategy" value="messier">
                        <label style="display:inline;" for="mode5">Objets du Catalogue de Messier</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Options:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="flag_lowercase" name="flag_lowercase" value="true" checked>
                        <label style="display:inline;" for="flag_lowercase">Minuscules</label>
                        <br>
                        <input type="checkbox" id="flag_tf_idf" name="flag_tf_idf" value="true">
                        <label style="display:inline;" for="flag_tf_idf">TF-IDF</label>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit">Soumettre</button>
                    <button type="reset" id="resetBtn">Réinitialiser</button>
                </div>
            </form>
        </div>

        <!-- DIVISION DROITE : RÉSULTATS DYNAMIQUES -->
        <div class="right-panel">
            <div class="tab-container">
                <button class="tab-button active" onclick="ouvrirOnglet(event, 'resultPanel')">Catégorisation</button>
                <button class="tab-button" onclick="ouvrirOnglet(event, 'statPanel')">Statistiques</button>
                <button class="tab-button" onclick="ouvrirOnglet(event, 'topBottom')">Palmarès</button>
            </div>
            <div id="resultPanel" class="tab-content" style="display: block;">
                <p style="color: #666; font-style: italic;">En attente de la soumission des paramètres...</p>
            </div>
            <div id="statPanel" class="tab-content">
                <p style="color: #666; font-style: italic;">&nbsp;</p>
            </div>
            <div id="topBottom" class="tab-content">
                <p style="color: #666; font-style: italic;">&nbsp;</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='/main_web_app.js') }}"></script>
    <script src="{{ url_for('static', path='/tab.js') }}"></script>
</body>
</html>
